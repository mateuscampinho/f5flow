ltm node /Common/web01 {
    address 10.10.20.11
}
ltm node /Common/web02 {
    address 10.10.20.12
}
ltm node /Common/api01 {
    address 10.10.30.21
}
ltm pool /Common/pool_portal_https {
    members {
        /Common/web01:443 {
            address 10.10.20.11
        }
        /Common/web02:443 {
            address 10.10.20.12
        }
    }
    monitor /Common/https
    load-balancing-mode least-connections-member
}
ltm pool /Common/pool_api {
    members {
        /Common/api01:8080 {
            address 10.10.30.21
        }
    }
    monitor /Common/http
}
ltm pool /Common/pool_manutencao {
    members {
        /Common/web02:80 {
            address 10.10.20.12
        }
    }
}
ltm data-group internal /Common/dg_rotas {
    records {
        /api {
            data pool_api
        }
    }
    type string
}
ltm policy /Common/pol_portal {
    controls { forwarding }
    requires { http }
    rules {
        api {
            actions {
                0 {
                    forward
                    select
                    pool /Common/pool_api
                }
            }
            conditions {
                0 {
                    http-uri
                    path
                    starts-with
                    values { /api }
                }
            }
            ordinal 1
        }
    }
    strategy /Common/first-match
}
ltm rule /Common/ir_manutencao {
when HTTP_REQUEST {
    if { [HTTP::uri] starts_with "/manutencao" } {
        pool pool_manutencao
    } elseif { [HTTP::host] eq "antigo.exemplo.com.br" } {
        HTTP::redirect "https://portal.exemplo.com.br[HTTP::uri]"
    }
}
}
ltm virtual /Common/vs_portal_https {
    destination /Common/10.10.10.50:443
    ip-protocol tcp
    pool /Common/pool_portal_https
    policies {
        /Common/pol_portal { }
    }
    profiles {
        /Common/http { }
        /Common/clientssl {
            context clientside
        }
        /Common/tcp { }
    }
    rules {
        /Common/ir_manutencao
    }
    source-address-translation {
        type automap
    }
}
ltm virtual /Common/vs_portal_http {
    destination /Common/10.10.10.50:80
    ip-protocol tcp
    profiles {
        /Common/http { }
        /Common/tcp { }
    }
    rules {
        /Common/_sys_https_redirect
    }
}
